# 이벤트 데이터 자동 갱신.
#
# 이 저장소의 앱은 src/data/events.json 을 빌드 시점에 번들로 굽는다.
# 즉 데이터를 새로 넣으려면 커밋이 필요하다 — 그 커밋을 사람 대신 여기서 만든다.
#
# 크롤러는 node 내장 기능만 쓰고 환경변수도 안 받으므로 시크릿이 필요 없다.
name: 데이터 갱신

on:
  schedule:
    # 매일 04:00 KST (= 19:00 UTC 전날). 상대 서버가 한가한 시간대를 고른다
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간(일)'
        default: '90'
      limit:
        description: '소스별 최대 건수'
        default: '700'

# 앞선 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다.
# 같은 파일을 두 잡이 동시에 커밋하면 푸시가 충돌한다
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  # 기본값은 읽기 전용이라, 이게 없으면 마지막 push 에서 403 이 난다
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 크롤은 요청 간격 700ms 고정이라 8분 이상 걸린다. 넉넉히 준다
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 수집
        run: |
          node crawler/run.mjs \
            --source all \
            --limit ${{ github.event.inputs.limit || '700' }} \
            --days ${{ github.event.inputs.days || '90' }}

      - name: 정규화
        run: node crawler/to-events.mjs

      - name: 검증
        # 크롤러가 조용히 깨졌을 때 빈 데이터를 커밋해 앱을 비우는 것을 막는다.
        # 실패해야 할 것은 실패하게 두는 편이, 틀린 데이터가 배포되는 것보다 낫다
        run: node scripts/validate-events.mjs

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- src/data/events.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/events.json
          git commit -m "data: 이벤트 갱신 ($(date -u '+%Y-%m-%d'))

          crawler/run.mjs + to-events.mjs 자동 실행 결과.
          .github/workflows/refresh-data.yml 이 매일 04:00 KST 에 돈다."
          git push
